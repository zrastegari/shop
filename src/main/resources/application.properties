# ---- تنظیمات هم‌پیمایی (Carpool Matching) ----
# حداکثر مسافت جاده‌ای (متر) برای پذیرش یک پیشنهاد تطابق (مرحله ۳)
carpool.matching.max-road-distance-meters=5000
# اگر true باشد مرحله ۳ (فراخوانی API ماتریس فاصله نشون) اجرا می‌شود؛ برای تست می‌توان false کرد
carpool.matching.use-distance-matrix-api=true

# ---- تنظیمات تاکسی اشتراکی (Shared Taxi Matching) ----
# بیشترین انحراف قابل‌قبول برای مسافر(های) فعلی سوار (متر) — مرحله ۴
sharedtaxi.matching.max-detour-meters-existing-passenger=2000
# بیشترین مسافت اضافه‌ی قابل‌قبول برای مسیر کل راننده (متر) — مرحله ۴
sharedtaxi.matching.max-extra-distance-meters-driver=5000
# اگر true باشد فراخوانی API ماتریس فاصله نشون انجام می‌شود؛ برای تست می‌توان false کرد
sharedtaxi.matching.use-distance-matrix-api=true
# آستانه‌ی فیلتر خشن فاصله در مرحله ۱ (متر)
sharedtaxi.matching.coarse-distance-threshold-meters=8000
